<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque de Produtos</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #333; }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .erro { color: red; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Estoque do Sistema</h1>
  <div id="status">Conectando ao banco de dados...</div>
  <div id="produtos-list"></div>

  <script>
    const SUPABASE_URL = 'https://mmuyldjchdekxeeeafjm.supabase.co'; 
    const SUPABASE_ANON_KEY = 'Sb_publishable_BDjlzJ74FN8jDxP-C_DsQw_b4tgvRrV';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function testarConexao() {
      const statusEl = document.getElementById('status');
      const container = document.getElementById('produtos-list');

      try {
        // Tenta buscar da tabela "produtos"
        const { data, error } = await supabase.from('produtos').select('*');

        if (error) {
          statusEl.innerHTML = `<span class="erro">Erro do Supabase: ${error.message}</span>`;
          return;
        }

        if (!data || data.length === 0) {
          statusEl.textContent = 'Conectado com sucesso, mas a tabela "produtos" está vazia ou sem permissão de leitura!';
          return;
        }

        statusEl.style.display = 'none';
        container.innerHTML = data.map(prod => `
          <div class="card">
            <div><strong>CÓD:</strong> ${prod.codigo || prod.id}</div>
            <div><strong>Descrição:</strong> ${prod.descricao || prod.nome}</div>
            <div><strong>Preço:</strong> R$ ${Number(prod.valor_unitario || prod.preco || 0).toFixed(2)}</div>
          </div>
        `).join('');

      } catch (err) {
        statusEl.innerHTML = `<span class="erro">Erro no código: ${err.message}</span>`;
      }
    }

    testarConexao();
  </script>
</body>
</html>
