<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque de Produtos</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #333; }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    pre { background: #eee; padding: 10px; border-radius: 4px; font-size: 0.85em; overflow-x: auto; }
  </style>
</head>
<body>

  <h1>Diagnóstico Completo do Banco</h1>
  <div id="status">Carregando dados...</div>
  <div id="produtos-list"></div>

  <script>
    const SUPABASE_URL = 'https://mmuyldjchdekxeeeafjm.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tdXlsZGpjaGRla3hlZWVhZmptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwMjg0NjcsImV4cCI6MjEwMDYwNDQ2N30.zGmYatqKxCdf_zjDF75DOcgS67TXvu_w3fiEthnDg5I';

    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function carregar() {
      const statusEl = document.getElementById('status');
      const container = document.getElementById('produtos-list');

      const { data, error } = await _supabase.from('produtos').select('*');

      if (error) {
        statusEl.innerHTML = `<b style="color:red">Erro: ${error.message}</b>`;
        return;
      }

      statusEl.style.display = 'none';
      
      // Mostra o objeto exato que veio do Supabase em formato de texto para sabermos os nomes das colunas e valores
      container.innerHTML = data.map(prod => `
        <div class="card">
          <p><strong>Dados crus do produto no banco:</strong></p>
          <pre>${JSON.stringify(prod, null, 2)}</pre>
        </div>
      `).join('');
    }

    carregar();
  </script>
</body>
</html>
