<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque de Produtos</title>
  
  <!-- Importa a biblioteca do Supabase via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #333;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .codigo {
      font-size: 0.85em;
      color: #888;
      margin-bottom: 5px;
    }
    .descricao {
      font-weight: bold;
      font-size: 1.1em;
      color: #222;
      margin-bottom: 8px;
    }
    .preco {
      color: #2e7d32;
      font-weight: bold;
      font-size: 1.2em;
    }
    .loading {
      font-style: italic;
      color: #666;
    }
  </style>
</head>
<body>

  <h1>Estoque do Sistema</h1>
  <div id="status" class="loading">Carregando produtos...</div>
  <div id="produtos-list" class="grid"></div>

  <script>
    // Suas credenciais do projeto Drogaria Stock
    const SUPABASE_URL = 'https://mmuyldjchdekxeeeafjm.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_default';

    // Inicializa o Supabase
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Função para buscar os produtos no banco de dados
    async function carregarProdutos() {
      const statusElement = document.getElementById('status');
      const container = document.getElementById('produtos-list');

      try {
        const { data: produtos, error } = await supabase
          .from('produtos')
          .select('*');

        if (error) throw error;

        statusElement.style.display = 'none';

        if (!produtos || produtos.length === 0) {
          container.innerHTML = '<p>Nenhum produto encontrado no estoque.</p>';
          return;
        }

        // Renderiza cada produto na tela
        container.innerHTML = produtos.map(prod => `
          <div class="card">
            <div class="codigo">CÓD: ${prod.codigo}</div>
            <div class="descricao">${prod.descricao}</div>
            <div class="preco">R$ ${Number(prod.valor_unitario).toFixed(2)}</div>
          </div>
        `).join('');

      } catch (err) {
        console.error('Erro na conexão:', err);
        statusElement.textContent = 'Erro ao carregar os produtos. Verifique se a sua Publishable Key no Supabase é a default.';
        statusElement.style.color = 'red';
      }
    }

    // Executa a busca ao abrir a página
    carregarProdutos();
  </script>
</body>
</html>
