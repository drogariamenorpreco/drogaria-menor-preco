<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farma Lagos - Estoque</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 15px;
    }
    .header-loja { text-align: center; margin-bottom: 20px; }
    h1 { color: #333; font-size: 1.5em; margin: 5px 0; }
    .cnpj-info { font-size: 0.9em; color: #555; font-weight: bold; }
    .form-card {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 6px 0 12px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1em;
    }
    button {
      background-color: #2e7d32;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 4px;
      width: 100%;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
    }
    button:active { background-color: #1b5e20; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      position: relative;
    }
    .codigo { font-size: 0.85em; color: #888; }
    .descricao { font-weight: bold; font-size: 1.1em; color: #222; margin: 4px 0; }
    .preco { color: #2e7d32; font-weight: bold; font-size: 1.2em; margin-bottom: 10px; }
    .btn-excluir {
      background-color: #c62828;
      padding: 6px;
      font-size: 0.85em;
      margin-top: 5px;
    }
    #status { text-align: center; color: #666; margin-bottom: 15px; font-style: italic; }
  </style>
</head>
<body>

  <div class="header-loja">
    <h1>FARMA LAGOS</h1>
    <div class="cnpj-info">CNPJ: 68.530.976/0001-00</div>
  </div>

  <div class="form-card">
    <h3>Ajustar / Adicionar Preço Manual</h3>
    <input type="text" id="codigo" placeholder="Código do Produto (ex: 051173)">
    <input type="text" id="descricao" placeholder="Nome / Descrição do Produto">
    <input type="number" step="0.01" id="preco" placeholder="Preço (R$)">
    <button onclick="salvarPrecoManual()">Salvar / Atualizar Preço</button>
  </div>

  <div id="status">Sincronizando com o sistema...</div>
  <div id="produtos-list" class="grid"></div>

  <script>
    const SUPABASE_URL = 'https://mmuyldjchdekxeeeafjm.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tdXlsZGpjaGRla3hlZWVhZmptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwMjg0NjcsImV4cCI6MjEwMDYwNDQ2N30.zGmYatqKxCdf_zjDF75DOcgS67TXvu_w3fiEthnDg5I';

    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function carregarTudo() {
      const statusEl = document.getElementById('status');
      const container = document.getElementById('produtos-list');

      let manuais = JSON.parse(localStorage.getItem('estoque_manual')) || [];

      try {
        const { data, error } = await _supabase.from('produtos').select('*');

        if (error) {
          console.warn("Erro ao buscar do Supabase, usando apenas dados locais:", error.message);
        }

        let listaFinal = [];

        if (data && data.length > 0) {
          listaFinal = data.map(prod => {
            const cod = String(prod.codigo || prod.id || '');
            const manualEncontrado = manuais.find(m => m.codigo === cod);

            const precoFinal = manualEncontrado ? manualEncontrado.preco : (prod.preco || prod.valor || prod.valor_unitario || 0);
            const descFinal = manualEncontrado ? manualEncontrado.descricao : (prod.descricao || prod.nome || 'Produto');

            return {
              codigo: cod,
              descricao: descFinal,
              preco: precoFinal,
              origem: manualEncontrado ? 'manual' : 'supabase'
            };
          });
        }

        manuais.forEach(m => {
          if (!listaFinal.some(item => item.codigo === m.codigo)) {
            listaFinal.push(m);
          }
        });

        if (listaFinal.length === 0) {
          statusEl.textContent = 'Nenhum produto encontrado.';
          container.innerHTML = '';
          return;
        }

        statusEl.style.display = 'none';
        container.innerHTML = listaFinal.map((p, index) => `
          <div class="card">
            <div class="codigo">CÓD: ${p.codigo}</div>
            <div class="descricao">${p.descricao}</div>
            <div class="preco">R$ ${Number(p.preco).toFixed(2)}</div>
            ${p.origem === 'manual' ? `<button class="btn-excluir" onclick="excluirManual('${p.codigo}')">Remover Ajuste</button>` : ''}
          </div>
        `).join('');

      } catch (e) {
        statusEl.textContent = 'Modo Offline / Usando dados locais.';
        if (manuais.length > 0) {
          container.innerHTML = manuais.map((p, index) => `
            <div class="card">
              <div class="codigo">CÓD: ${p.codigo}</div>
              <div class="descricao">${p.descricao}</div>
              <div class="preco">R$ ${Number(p.preco).toFixed(2)}</div>
              <button class="btn-excluir" onclick="excluirManual('${p.codigo}')">Remover</button>
            </div>
          `).join('');
        }
      }
    }

    function salvarPrecoManual() {
      const codigo = document.getElementById('codigo').value.trim();
      const descricao = document.getElementById('descricao').value.trim();
      const preco = document.getElementById('preco').value.trim();

      if (!codigo || !descricao || !preco) {
        alert('Por favor, preencha todos os campos!');
        return;
      }

      let manuais = JSON.parse(localStorage.getItem('estoque_manual')) || [];
      manuais = manuais.filter(m => m.codigo !== codigo);
      manuais.push({ codigo, descricao, preco, origem: 'manual' });
      localStorage.setItem('estoque_manual', JSON.stringify(manuais));

      document.getElementById('codigo').value = '';
      document.getElementById('descricao').value = '';
      document.getElementById('preco').value = '';

      carregarTudo();
      alert('Preço salvo com sucesso!');
    }

    function excluirManual(codigo) {
      let manuais = JSON.parse(localStorage.getItem('estoque_manual')) || [];
      manuais = manuais.filter(m => m.codigo !== codigo);
      localStorage.setItem('estoque_manual', JSON.stringify(manuais));
      carregarTudo();
    }

    carregarTudo();
  </script>
</body>
</html>
