<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Estoque Manual</title>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 15px;
    }
    h1 { color: #333; font-size: 1.5em; text-align: center; }
    .form-card {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 6px 0 12px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1em;
    }
    button {
      background-color: #2e7d32;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 4px;
      width: 100%;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
    }
    button:active { background-color: #1b5e20; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      position: relative;
    }
    .codigo { font-size: 0.85em; color: #888; }
    .descricao { font-weight: bold; font-size: 1.1em; color: #222; margin: 4px 0; }
    .preco { color: #2e7d32; font-weight: bold; font-size: 1.2em; margin-bottom: 10px; }
    .btn-excluir {
      background-color: #c62828;
      padding: 6px;
      font-size: 0.85em;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <h1>Controle de Estoque</h1>

  <div class="form-card">
    <h3>Adicionar / Editar Produto</h3>
    <input type="text" id="codigo" placeholder="Código do Produto (ex: 051173)">
    <input type="text" id="descricao" placeholder="Nome / Descrição do Produto">
    <input type="number" step="0.01" id="preco" placeholder="Preço (R$)">
    <button onclick="salvarProduto()">Salvar Produto</button>
  </div>

  <h2>Produtos Cadastrados</h2>
  <div id="produtos-list" class="grid"></div>

  <script>
    function carregarProdutos() {
      let produtos = JSON.parse(localStorage.getItem('estoque_produtos')) || [];
      const container = document.getElementById('produtos-list');

      if (produtos.length === 0) {
        container.innerHTML = '<p style="color: #666; text-align:center;">Nenhum produto cadastrado ainda.</p>';
        return;
      }

      container.innerHTML = produtos.map((p, index) => `
        <div class="card">
          <div class="codigo">CÓD: ${p.codigo}</div>
          <div class="descricao">${p.descricao}</div>
          <div class="preco">R$ ${Number(p.preco).toFixed(2)}</div>
          <button class="btn-excluir" onclick="excluirProduto(${index})">Excluir</button>
        </div>
      `).join('');
    }

    function salvarProduto() {
      const codigo = document.getElementById('codigo').value;
      const descricao = document.getElementById('descricao').value;
      const preco = document.getElementById('preco').value;

      if (!codigo || !descricao || !preco) {
        alert('Por favor, preencha todos os campos!');
        return;
      }

      let produtos = JSON.parse(localStorage.getItem('estoque_produtos')) || [];
      
      // Adiciona o novo produto na lista
      produtos.push({ codigo, descricao, preco });
      
      localStorage.setItem('estoque_produtos', JSON.stringify(produtos));

      // Limpa os campos
      document.getElementById('codigo').value = '';
      document.getElementById('descricao').value = '';
      document.getElementById('preco').value = '';

      carregarProdutos();
    }

    function excluirProduto(index) {
      let produtos = JSON.parse(localStorage.getItem('estoque_produtos')) || [];
      produtos.splice(index, 1);
      localStorage.setItem('estoque_produtos', JSON.stringify(produtos));
      carregarProdutos();
    }

    // Carrega ao iniciar a página
    carregarProdutos();
  </script>
</body>
</html>
